<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Finance UI Demo" />
<meta name="theme-color" content="#000000" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./icon-180.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<title>Finance UI Demo</title>

<style>
:root{
  --project-license:"RAZVAN ANDREI JUNCU";
  --black:#000;
  --card:#18181a;
  --card-hi:#202022;
  --search:#29292b;
  --detail:#1b1b1d;
  --detail-card:#242426;
  --text:#f7f7f8;
  --muted:#9a9a9f;
  --muted-dim:#707075;
  --green:#1dc9b0;
  --blue:#75a1ff;
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --display:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;width:100%;height:100%;background:#000;color:var(--text);
  font-family:var(--font);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  font-synthesis:none;overscroll-behavior:none;
}
body{position:fixed;inset:0;overflow:hidden}
button,input{font:inherit}
.app{position:absolute;inset:0;margin:auto;width:100%;max-width:430px;background:#000;overflow:hidden}
.page{position:absolute;inset:0;background:#000;transition:transform .22s cubic-bezier(.22,.8,.26,1),opacity .2s}
.page.hidden-right{transform:translateX(100%);pointer-events:none}
.page.hidden-left{transform:translateX(-15%);opacity:.38;pointer-events:none}
.scroll{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.safe-top{height:calc(env(safe-area-inset-top) + 2px)}

.project-mark{
  display:inline-flex;align-items:center;gap:5px;margin-top:10px;
  color:rgba(255,255,255,.42);font-size:8.5px;line-height:11px;font-weight:700;
  letter-spacing:.075em;text-transform:uppercase;white-space:nowrap
}
.project-mark::after{content:var(--project-license)}

/* TRANSACTION LIST */
.list-head{padding:0 17px}
.back-btn{
  width:42px;height:42px;margin-left:-10px;border:0;background:none;color:#fff;
  display:grid;place-items:center;font-size:38px;line-height:1;font-weight:200;padding:0;cursor:pointer
}
.balance{
  margin-top:9px;font-family:var(--display);font-size:38px;line-height:41px;font-weight:700;
  letter-spacing:-1.55px;font-variant-numeric:tabular-nums
}
.balance .minor{font-size:25px;letter-spacing:-.75px}
.balance-label{margin-top:5px;color:#737378;font-size:15px;line-height:19px;font-weight:500;letter-spacing:-.28px}

.search-row{display:flex;align-items:center;gap:14px;padding:20px 17px 20px}
.search-shell{
  height:44px;min-width:0;flex:1;border-radius:23px;background:var(--search);
  display:flex;align-items:center;gap:10px;padding:0 14px;color:#aaaab0
}
.search-shell svg{flex:none}
.search-input{
  min-width:0;flex:1;border:0;outline:0;background:transparent;color:#fff;
  font-size:16px;line-height:21px;font-weight:500;letter-spacing:-.28px
}
.search-input::placeholder{color:#a0a0a5;opacity:1}
.filter{width:40px;height:40px;border:0;background:none;color:#fff;padding:0;display:grid;place-items:center}

.section{padding:0 17px 4px}
.section-heading{display:flex;justify-content:space-between;align-items:baseline;margin:13px 0 11px}
.section-title{font-family:var(--display);font-size:22px;line-height:27px;font-weight:700;letter-spacing:-.48px}
.section-total{
  color:#a0a0a5;font-size:17px;line-height:21px;font-weight:600;letter-spacing:-.20px;
  font-variant-numeric:tabular-nums
}
.tx-card{background:var(--card);border-radius:17px;overflow:hidden;padding:1px 0}
.tx{
  width:100%;min-height:72px;border:0;background:transparent;color:inherit;text-align:left;
  display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;
  padding:12px 15px;cursor:pointer
}
.tx:active{background:var(--card-hi)}
.tx-logo{
  width:44px;height:44px;display:grid;place-items:center;position:relative;overflow:visible;flex:none
}
.tx-logo img{width:44px;height:44px;display:block;object-fit:contain;border-radius:50%}
.person-badge{
  position:absolute;right:-4px;bottom:-3px;width:21px;height:21px;border:2px solid var(--card);
  border-radius:50%;background:#f7f7f8;color:#171719;display:grid;place-items:center;
  font-size:14px;font-weight:800;line-height:1
}
.tx-name{
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-family:var(--display);font-size:18px;line-height:22px;font-weight:600;letter-spacing:-.30px
}
.tx-time{
  margin-top:2px;color:#9a9a9f;font-size:15px;line-height:19px;font-weight:400;
  letter-spacing:-.08px;font-variant-numeric:tabular-nums
}
.tx-amount{
  align-self:start;padding-top:4px;white-space:nowrap;text-align:right;
  font-size:17px;line-height:21px;font-weight:500;letter-spacing:-.16px;
  font-variant-numeric:tabular-nums
}
.tx-amount.positive{color:var(--green)}
.list-bottom{height:calc(26px + env(safe-area-inset-bottom))}

/* DETAIL */
.detail-scroll{background:var(--detail)}
.hero{
  min-height:404px;padding:calc(env(safe-area-inset-top) + 6px) 17px 23px;
  background:
    radial-gradient(circle at 50% 29%,rgba(255,255,255,.20),transparent 23%),
    linear-gradient(180deg,#898587 0%,#6b6769 22%,#454345 47%,#262628 72%,#1b1b1d 100%)
}
.detail-top{display:flex;justify-content:space-between;align-items:center}
.close,.more{border:0;background:none;color:#fff;width:42px;height:42px;display:grid;place-items:center;padding:0;cursor:pointer}
.close{font-size:38px;font-weight:200;line-height:1}
.more{font-size:27px;letter-spacing:2px;padding-bottom:7px}
.detail-license{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 18px)}
.merchant{margin-top:48px;text-align:center;display:flex;flex-direction:column;align-items:center}
.detail-logo{width:78px;height:78px;border-radius:50%;overflow:hidden;background:#fff}
.detail-logo img{display:block;width:100%;height:100%;object-fit:cover}
.detail-name{margin-top:18px;font-size:20px;line-height:24px;font-weight:600;letter-spacing:-.28px}
.detail-amount{
  margin-top:10px;font-family:var(--display);font-size:46px;line-height:50px;font-weight:600;
  letter-spacing:-1.10px;font-variant-numeric:tabular-nums
}
.detail-date{margin-top:11px;font-size:17px;line-height:22px;font-weight:400;letter-spacing:-.10px}
.split{
  margin-top:26px;border:0;border-radius:24px;background:#363638;color:#fff;height:46px;padding:0 19px;
  display:inline-flex;align-items:center;gap:10px;font-size:16px;line-height:20px;font-weight:600;letter-spacing:-.10px
}
.detail-body{padding:0 17px 25px;background:var(--detail)}
.info{
  margin-bottom:14px;padding:15px 17px;background:var(--detail-card);border-radius:16px
}
.reward{position:relative;min-height:142px;padding:17px 17px 17px 75px}
.reward-icon{
  position:absolute;left:17px;top:17px;width:44px;height:44px;border-radius:50%;background:#444447;
  display:grid;place-items:center;font-size:20px
}
.reward-close{position:absolute;right:16px;top:12px;color:#77777b;font-size:23px;font-weight:700}
.reward-title{font-size:18px;line-height:22px;font-weight:600;letter-spacing:-.20px}
.reward-copy{margin-top:2px;color:#9b9ba0;font-size:17px;line-height:21px;font-weight:400;letter-spacing:-.10px}
.reward-button{
  width:calc(100% + 58px);margin-left:-58px;margin-top:16px;height:46px;border:0;border-radius:24px;
  background:#49494c;color:#fff;font-size:16px;line-height:20px;font-weight:600;letter-spacing:-.10px
}
.label{color:#a6a6ab;font-size:16px;line-height:20px;font-weight:600;letter-spacing:-.12px;margin-bottom:8px}
.value{font-size:17px;line-height:22px;font-weight:400;letter-spacing:-.10px}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:18px}
.card-brand{color:var(--blue);font-weight:600}
.detail-bottom{height:calc(20px + env(safe-area-inset-bottom))}

@media(min-width:431px){body{background:#111}.app{box-shadow:0 0 30px rgba(0,0,0,.55)}}
</style>
</head>
<body>
<div class="app">

<section class="page" id="listPage">
  <div class="scroll">
    <div class="safe-top"></div>

    <header class="list-head">
      <button class="back-btn" aria-label="Zurück">‹</button>
      <div class="balance">2.327<span class="minor">,26 lei</span></div>
      <div class="balance-label">Aktueller Kontostand</div>
      <div class="project-mark" id="licenseList" aria-label="RAZVAN ANDREI JUNCU"></div>
    </header>

    <div class="search-row">
      <label class="search-shell">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="10.4" cy="10.4" r="6.5" stroke="currentColor" stroke-width="2.15"/>
          <path d="m15.5 15.5 5.2 5.2" stroke="currentColor" stroke-width="2.15" stroke-linecap="round"/>
        </svg>
        <input id="search" class="search-input" type="search" placeholder="Suche" autocomplete="off">
      </label>
      <button class="filter" aria-label="Filter">
        <svg width="27" height="27" viewBox="0 0 28 28" fill="none" aria-hidden="true">
          <path d="M5 8h18M8 14h12M11 20h6" stroke="currentColor" stroke-width="2.9" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <main id="groups">
      <section class="section" data-group="today">
        <div class="section-heading">
          <div class="section-title" id="todayLabel">Heute</div>
          <div class="section-total">+1.904,76 lei</div>
        </div>
        <div class="tx-card">
          <button class="tx" id="latestTransaction" type="button">
            <div class="tx-logo"><img src="./stb.png" alt=""></div>
            <div><div class="tx-name">STB Bucuresti</div><div class="tx-time" id="timeLatest">19:42</div></div>
            <div class="tx-amount">-3 lei</div>
          </button>
          <button class="tx" type="button">
            <div class="tx-logo"><img src="./metrorex.png" alt=""></div>
            <div><div class="tx-name">Metrorex</div><div class="tx-time" id="timeMetroToday">11:20</div></div>
            <div class="tx-amount">-5 lei</div>
          </button>
          <button class="tx" type="button">
            <div class="tx-logo"><img src="./stb.png" alt=""></div>
            <div><div class="tx-name">STB Bucuresti</div><div class="tx-time" id="timeStbBig">10:54</div></div>
            <div class="tx-amount">-80 lei</div>
          </button>
          <button class="tx" type="button">
            <div class="tx-logo"><img src="./mega-image.png" alt=""></div>
            <div><div class="tx-name">Mega Image</div><div class="tx-time" id="timeMegaToday">10:32</div></div>
            <div class="tx-amount">-7,24 lei</div>
          </button>
          <button class="tx" type="button">
            <div class="tx-logo"><img src="./radu.png" alt=""><span class="person-badge">←</span></div>
            <div><div class="tx-name">Radu Teodor Juncu</div><div class="tx-time" id="timeRadu">08:24</div></div>
            <div class="tx-amount positive">+2.000 lei</div>
          </button>
        </div>
      </section>

      <section class="section" data-group="yesterday">
        <div class="section-heading">
          <div class="section-title">Gestern</div>
          <div class="section-total">-42,55 lei</div>
        </div>
        <div class="tx-card">
          <button class="tx" type="button">
            <div class="tx-logo"><img src="./mega-image.png" alt=""></div>
            <div><div class="tx-name">Mega Image</div><div class="tx-time">19:07</div></div>
            <div class="tx-amount">-4,79 lei</div>
          </button>
          <button class="tx" type="button">
            <div class="tx-logo"><img src="./metrorex.png" alt=""></div>
            <div><div class="tx-name">Metrorex</div><div class="tx-time">17:42</div></div>
            <div class="tx-amount">-5 lei</div>
          </button>
          <button class="tx" type="button">
            <div class="tx-logo"><img src="./stb.png" alt=""></div>
            <div><div class="tx-name">STB Bucuresti</div><div class="tx-time">16:20</div></div>
            <div class="tx-amount">-3 lei</div>
          </button>
          <button class="tx" type="button">
            <div class="tx-logo"><img src="./mega-image.png" alt=""></div>
            <div><div class="tx-name">Mega Image</div><div class="tx-time">13:05</div></div>
            <div class="tx-amount">-12,76 lei</div>
          </button>
          <button class="tx" type="button">
            <div class="tx-logo"><img src="./metrorex.png" alt=""></div>
            <div><div class="tx-name">Metrorex</div><div class="tx-time">09:35</div></div>
            <div class="tx-amount">-17 lei</div>
          </button>
        </div>
      </section>

      <section class="section" data-group="older">
        <div class="section-heading">
          <div class="section-title" id="olderLabel">15. September</div>
          <div class="section-total">-27,74 lei</div>
        </div>
        <div class="tx-card">
          <button class="tx" type="button">
            <div class="tx-logo"><img src="./stb.png" alt=""></div>
            <div><div class="tx-name">STB Bucuresti</div><div class="tx-time">18:26</div></div>
            <div class="tx-amount">-3 lei</div>
          </button>
          <button class="tx" type="button">
            <div class="tx-logo"><img src="./mega-image.png" alt=""></div>
            <div><div class="tx-name">Mega Image</div><div class="tx-time">16:11</div></div>
            <div class="tx-amount">-11,49 lei</div>
          </button>
          <button class="tx" type="button">
            <div class="tx-logo"><img src="./metrorex.png" alt=""></div>
            <div><div class="tx-name">Metrorex</div><div class="tx-time">13:38</div></div>
            <div class="tx-amount">-5 lei</div>
          </button>
          <button class="tx" type="button">
            <div class="tx-logo"><img src="./mega-image.png" alt=""></div>
            <div><div class="tx-name">Mega Image</div><div class="tx-time">09:52</div></div>
            <div class="tx-amount">-8,25 lei</div>
          </button>
        </div>
      </section>
    </main>
    <div class="list-bottom"></div>
  </div>
</section>

<section class="page hidden-right" id="detailPage">
  <div class="scroll detail-scroll">
    <div class="hero">
      <div class="detail-top">
        <button class="close" id="closeDetail" aria-label="Schließen">×</button>
        <button class="more" aria-label="Mehr">•••</button>
      </div>

      <div class="detail-license project-mark" id="licenseDetail" aria-label="RAZVAN ANDREI JUNCU"></div>

      <div class="merchant">
        <div class="detail-logo"><img src="./stb.png" alt="STB"></div>
        <div class="detail-name">STB Bucuresti</div>
        <div class="detail-amount">-3 lei</div>
        <div class="detail-date" id="detailDate">Heute, 18:33</div>
        <button class="split"><span style="font-size:20px">Y</span> Rechnung aufteilen</button>
      </div>
    </div>

    <div class="detail-body">
      <div class="info reward">
        <div class="reward-icon">✦</div>
        <div class="reward-close">×</div>
        <div class="reward-title">Belohnungen verpasst</div>
        <div class="reward-copy">Verdiene Belohnungen für deine Ausgaben</div>
        <button class="reward-button">RevPoints kostenlos beitreten</button>
      </div>

      <div class="info">
        <div class="label">Standort</div>
        <div class="value">Bucuresti, Rumänien</div>
      </div>

      <div class="info">
        <div class="label">Status</div>
        <div class="value" id="status">Ausstehend</div>
      </div>

      <div class="info row-between">
        <div class="label" style="margin:0">Karte</div>
        <div class="value card-brand">▰ Visa ··0764</div>
      </div>

      <div class="detail-bottom"></div>
    </div>
  </div>
</section>

</div>

<script>
(() => {
  const PAYMENT_AGE_MINUTES = 12;

  const now = new Date();
  const payment = new Date(now.getTime() - PAYMENT_AGE_MINUTES * 60000);

  const pad = n => String(n).padStart(2, "0");
  const hm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const sameDay = (a,b) =>
    a.getFullYear()===b.getFullYear() &&
    a.getMonth()===b.getMonth() &&
    a.getDate()===b.getDate();

  const deLong = d =>
    new Intl.DateTimeFormat("de-DE",{day:"numeric",month:"long"}).format(d);

  const setText = (id, value) => {
    const el = document.getElementById(id);
    if (el) el.textContent = value;
  };

  // Latest payment
  setText("timeLatest", hm(payment));
  setText("todayLabel", sameDay(payment, now) ? "Heute" : "Gestern");

  // Scatter the other same-day entries before the latest payment.
  const midnight = new Date(payment);
  midnight.setHours(0,0,0,0);
  const elapsed = Math.max(30, (payment - midnight) / 60000);

  const makeEarlier = fraction => {
    const back = Math.max(4, Math.round(elapsed * fraction));
    const t = new Date(payment.getTime() - back * 60000);
    return t < midnight ? new Date(midnight.getTime() + 5*60000) : t;
  };

  setText("timeMetroToday", hm(makeEarlier(.43)));
  setText("timeStbBig", hm(makeEarlier(.455)));
  setText("timeMegaToday", hm(makeEarlier(.474)));
  setText("timeRadu", hm(makeEarlier(.565)));

  const older = new Date(payment);
  older.setDate(older.getDate() - 2);
  setText("olderLabel", deLong(older));

  // Detail page
  const listPage = document.getElementById("listPage");
  const detailPage = document.getElementById("detailPage");
  const latest = document.getElementById("latestTransaction");

  const openDetail = () => {
    setText("detailDate", `${sameDay(payment,now) ? "Heute" : deLong(payment)}, ${hm(payment)}`);

    const reversal = new Date(payment);
    reversal.setDate(reversal.getDate() + 9);
    setText(
      "status",
      `Ausstehend • Wird am ${deLong(reversal)} automatisch rückgängig gemacht, wenn nicht vom Händler beansprucht`
    );

    listPage.classList.add("hidden-left");
    detailPage.classList.remove("hidden-right");
    detailPage.querySelector(".scroll").scrollTop = 0;
  };

  if (latest) latest.addEventListener("click", openDetail);

  document.getElementById("closeDetail")?.addEventListener("click", () => {
    listPage.classList.remove("hidden-left");
    detailPage.classList.add("hidden-right");
  });

  // Search filters existing rows rather than rebuilding the whole page.
  document.getElementById("search")?.addEventListener("input", e => {
    const q = e.target.value.trim().toLocaleLowerCase("de-DE");
    document.querySelectorAll(".tx").forEach(row => {
      const name = row.querySelector(".tx-name")?.textContent.toLocaleLowerCase("de-DE") || "";
      row.style.display = !q || name.includes(q) ? "" : "none";
    });

    document.querySelectorAll(".section").forEach(section => {
      const anyVisible = [...section.querySelectorAll(".tx")].some(row => row.style.display !== "none");
      section.style.display = anyVisible ? "" : "none";
    });
  });

  // Existing GitHub Pages installs may still have an old service worker.
  // Unregister it and clear caches; this demo does not need offline caching.
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.getRegistrations()
      .then(regs => Promise.all(regs.map(r => r.unregister())))
      .catch(() => {});
  }
  if ("caches" in window) {
    caches.keys()
      .then(keys => Promise.all(keys.map(k => caches.delete(k))))
      .catch(() => {});
  }
})();
</script>
</body>
</html>
